[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osmo-research"
version = "0.1.0"
description = "Auditable pharmacokinetics research: chemical splits, explicit units, differentiable models and honest evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {file = "LICENSE"}
authors = [{name = "OSMO contributors"}]
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.3", "rdkit>=2023.9", "requests>=2.31", "pyarrow>=14", "joblib>=1.3", "torch>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
osmo = "osmo.cli:main"

[project.urls]
Repository = "https://github.com/shlbi/osmo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
